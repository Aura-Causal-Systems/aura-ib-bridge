# Test build of the macOS app, so Mac changes can be tried before a release.
# Runs on pull requests that touch the app or its packaging, and on demand (Actions -> mac-build ->
# Run workflow). The disk images appear under the run's "Artifacts" (kept 14 days); nothing is
# attached to a release - release.yml does that.
name: mac-build

on:
  pull_request:
    paths:
      - "ib_bridge/**"
      - "packaging/**"
      - "requirements.txt"
      - "instruments.json"
      - ".github/workflows/mac-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel] # Apple Silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test and build
        env:
          PYTHON: python
        run: packaging/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: dist/release/
          retention-days: 14
