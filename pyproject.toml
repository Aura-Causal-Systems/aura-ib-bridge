[project]
name = "aura-ib-bridge"
version = "0.3.0"
description = "Read-only local bridge between a trader's Interactive Brokers TWS and Aura Causal Systems web desks."
requires-python = ">=3.12"
dependencies = [
  "ib_async>=2.1.0,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pystray>=0.19,<1",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23", "pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["ib_bridge*"]
